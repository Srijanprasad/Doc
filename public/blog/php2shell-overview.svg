<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHP2Shell security overview</title>
  <desc id="desc">A server shield protecting a PHP runtime from two critical vulnerabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1320" cy="130" r="260" fill="#4f46e5" opacity=".16"/>
  <circle cx="220" cy="800" r="260" fill="#06b6d4" opacity=".12"/>
  <path d="M800 145 1125 265v215c0 210-136 330-325 390-189-60-325-180-325-390V265z" fill="url(#shield)" opacity=".96"/>
  <path d="M800 205 1060 302v170c0 164-101 263-260 321-159-58-260-157-260-321V302z" fill="#111827" opacity=".82"/>
  <text x="120" y="170" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="6">SECURITY BRIEF</text>
  <text x="120" y="260" fill="#fff" font-family="Arial, sans-serif" font-size="82" font-weight="700">PHP2Shell</text>
  <text x="120" y="325" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="32">Two critical PHP runtime vulnerabilities</text>
  <text x="800" y="405" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="42" font-weight="700">PATCH PHP</text>
  <text x="800" y="470" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="28">CVE-2026-109618 · CVE-2026-109619</text>
  <rect x="120" y="690" width="560" height="96" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="160" y="750" fill="#67e8f9" font-family="Arial, sans-serif" font-size="30" font-weight="700">CVSS 9.2 · CRITICAL</text>
  <rect x="920" y="690" width="560" height="96" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="1200" y="750" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">UNA AUTHENTICATED RCE</text>
</svg>
