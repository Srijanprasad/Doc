<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Simplified PHP2Shell request flow</title>
  <desc id="desc">A simplified diagram showing a request passing through a web server to PHP workers and the application.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1600" height="760" rx="32" fill="url(#panel)"/>
  <text x="90" y="100" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">Where PHP2Shell happens</text>
  <text x="90" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Simplified view — no exploit steps shown</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="290" width="280" height="150" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="240" y="350" fill="#bfdbfe" font-size="30" font-weight="700">HTTP request</text>
    <text x="240" y="390" fill="#93c5fd" font-size="22">multipart upload</text>
    <rect x="500" y="290" width="280" height="150" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
    <text x="640" y="350" fill="#cffafe" font-size="30" font-weight="700">Web server</text>
    <text x="640" y="390" fill="#a5f3fc" font-size="22">Apache / Nginx</text>
    <rect x="900" y="250" width="300" height="230" rx="20" fill="#422006" stroke="#fb923c" stroke-width="3"/>
    <text x="1050" y="320" fill="#ffedd5" font-size="30" font-weight="700">PHP worker</text>
    <text x="1050" y="365" fill="#fed7aa" font-size="22">request parsing</text>
    <text x="1050" y="405" fill="#fdba74" font-size="22">memory failure</text>
    <text x="1050" y="445" fill="#fb923c" font-size="22">stale state risk</text>
    <rect x="1320" y="290" width="190" height="150" rx="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
    <text x="1415" y="350" fill="#e0e7ff" font-size="27" font-weight="700">App</text>
    <text x="1415" y="390" fill="#c7d2fe" font-size="22">WordPress</text>
  </g>
  <path d="M390 365h95M790 365h95M1210 365h90" stroke="#67e8f9" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="900" y="575" width="300" height="70" rx="16" fill="#064e3b" stroke="#34d399"/>
  <text x="1050" y="620" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="25" font-weight="700">Patch the runtime</text>
</svg>
